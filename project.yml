name: InsuranceClaims
options:
  bundleIdPrefix: com.restu.insuranceclaims
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    ENABLE_BITCODE: NO
    FRAMEWORK_SEARCH_PATHS: "$(PROJECT_DIR)/Carthage/Build"
    STRIP_INSTALLED_PRODUCT: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      STRIP_STYLE: all
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_SYMBOLS_PRIVATE_EXTERN: YES
      GCC_GENERATE_DEBUGGING_SYMBOLS: NO
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_REFLECTION_METADATA_LEVEL: none

targets:
  InsuranceClaims:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: InsuranceClaims
    info:
      path: InsuranceClaims/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            jsonplaceholder.typicode.com:
              NSExceptionRequiresForwardSecrecy: true
              NSExceptionMinimumTLSVersion: TLSv1.2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.restu.insuranceclaims
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - framework: Carthage/Build/AsyncDisplayKit.xcframework
        embed: true
      - framework: Carthage/Build/Alamofire.xcframework
        embed: true
      - framework: Carthage/Build/RxSwift.xcframework
        embed: true
      - framework: Carthage/Build/RxRelay.xcframework
        embed: true
    prebuildScripts:
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint lint --quiet
          else
            echo "warning: SwiftLint not installed. Run 'brew install swiftlint'."
          fi
        name: SwiftLint

  InsuranceClaimsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: InsuranceClaimsTests
    dependencies:
      - target: InsuranceClaims
      - framework: Carthage/Build/Quick.xcframework
        embed: true
      - framework: Carthage/Build/Nimble.xcframework
        embed: true
      - framework: Carthage/Build/AsyncDisplayKit.xcframework
        embed: true
      - framework: Carthage/Build/Alamofire.xcframework
        embed: true
      - framework: Carthage/Build/RxSwift.xcframework
        embed: true
      - framework: Carthage/Build/RxRelay.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.restu.insuranceclaims.tests
        GENERATE_INFOPLIST_FILE: YES

  InsuranceClaimsAPITests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: InsuranceClaimsAPITests
    dependencies:
      - target: InsuranceClaims
      - framework: Carthage/Build/Quick.xcframework
        embed: true
      - framework: Carthage/Build/Nimble.xcframework
        embed: true
      - framework: Carthage/Build/RxSwift.xcframework
        embed: true
      - framework: Carthage/Build/RxRelay.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.restu.insuranceclaims.apitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  InsuranceClaims:
    build:
      targets:
        InsuranceClaims: all
        InsuranceClaimsTests: [test]
        InsuranceClaimsAPITests: [test]
    test:
      targets:
        - InsuranceClaimsTests
        - InsuranceClaimsAPITests
