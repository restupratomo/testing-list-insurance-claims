included:
  - InsuranceClaims
  - InsuranceClaimsTests
  - InsuranceClaimsAPITests

excluded:
  - Carthage
  - InsuranceClaims.xcodeproj

line_length:
  warning: 140
  error: 200

type_body_length:
  warning: 250
  error: 350

file_length:
  warning: 400
  error: 500

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

opt_in_rules:
  - empty_count
  - closure_spacing
  - redundant_nil_coalescing
  - sorted_imports

disabled_rules:
  - todo
  # Quick 7's QuickSpec requires `override class func spec()` — a static
  # method is not an option here, so this rule is a permanent false
  # positive on every spec file.
  - static_over_final_class

# Quick's `describe`/`context`/`it` DSL naturally produces one long
# `spec()` method per file; that's the intended shape of a spec, not a
# function that needs splitting up.
function_body_length:
  warning: 200
  error: 400
